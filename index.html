<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>EcoVigil</title>
<meta name="theme-color" content="#1F5C45" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="./icon-16.png" sizes="16x16" type="image/png" />
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="EcoVigil" />
<script>
  // Distingue le nom de l'onglet et le nom suggéré par "Ajouter à l'écran d'accueil" (iOS lit le
  // <title>/la balise apple-mobile-web-app-title au moment de l'enregistrement) selon qu'on ouvre
  // le lien citoyen ou le lien admin (?admin=1) — permet d'avoir deux raccourcis distincts sur
  // l'écran d'accueil, un par espace, plutôt que deux icônes identiques nommées "EcoVigil".
  (function () {
    try {
      var estAdmin = new URLSearchParams(location.search).get("admin") === "1";
      if (!estAdmin) return;
      document.title = "Centre EcoVigil";
      var meta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (meta) meta.setAttribute("content", "Centre EcoVigil");
      var theme = document.querySelector('meta[name="theme-color"]');
      if (theme) theme.setAttribute("content", "#2F5D7C"); // accent ardoise du MASTER : distingue l'espace admin sans sortir de la palette
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<link rel="stylesheet" href="./ecovigil-theme.css" />
<style>
  /* ===== Alias de compatibilité : --c-* -> --ev-* (MASTER) =====
     Les valeurs viennent de ecovigil-theme.css. Les composants existants gardent leurs noms --c-*,
     à remplacer progressivement par --ev-*. */
  :root, .pace-dark {
    --c-bg: var(--ev-bg);
    --c-surface: var(--ev-surface);
    --c-surface-soft: color-mix(in srgb, var(--ev-text) 5%, var(--ev-surface));
    --c-surface-dashed: color-mix(in srgb, var(--ev-text) 3%, var(--ev-surface));
    --c-border: var(--ev-border);
    --c-border-soft: var(--ev-border);
    --c-text: var(--ev-text);
    --c-text-secondary: var(--ev-text-muted);
    --c-text-muted: var(--ev-text-muted);
    --c-text-faint: var(--ev-text-muted); /* l'ancien « faint » n'atteignait pas 4,5:1 */
    --c-warning-bg: color-mix(in srgb, var(--ev-warning) 14%, var(--ev-surface));
    --c-success-bg: color-mix(in srgb, var(--ev-success) 14%, var(--ev-surface));
    --c-danger-border-soft: color-mix(in srgb, var(--ev-danger) 25%, var(--ev-surface));
    --c-warning-border-soft: color-mix(in srgb, var(--ev-warning) 30%, var(--ev-surface));
    --c-progress-track: color-mix(in srgb, var(--ev-primary) 35%, var(--ev-surface));
    --c-danger: var(--ev-danger);
    --c-warning: var(--ev-warning);
    --c-warning-text: var(--ev-warning);
    --shadow-sm: var(--ev-shadow);
    --shadow-md: var(--ev-shadow);
  }

  /* Accents : vert = principale, bleu = accent ardoise du MASTER (le doré a été retiré, hors MASTER).
     --c-accent-dark sert de FOND (texte blanc dessus) : il reste à la valeur claire en mode sombre. */
  :root, .accent-green { --c-accent-dark: #1F5C45; --c-accent: var(--ev-primary); --c-accent-text: var(--ev-primary); --c-sky: var(--ev-accent); }
  .accent-blue         { --c-accent-dark: #2F5D7C; --c-accent: var(--ev-accent);  --c-accent-text: var(--ev-accent);  --c-sky: var(--ev-primary); }

  /* ===== Mode sombre piloté par l'application (.pace-dark) : mêmes valeurs que le thème MASTER ===== */
  .pace-dark {
    --ev-primary: #4fb58a;
    --ev-primary-hover: #66c49c;
    --ev-on-primary: #0b1511;
    --ev-accent: #7fb0d1;
    --ev-accent-hover: #98c0dc;
    --ev-on-accent: #0b1511;
    --ev-bg: #0f1715;
    --ev-surface: #17221f;
    --ev-text: #e6eeeb;
    --ev-text-muted: #9db0a9;
    --ev-border: #26352f;
    --ev-success: #66bb6a;
    --ev-warning: #ffb74d;
    --ev-danger: #f2796f;
    --ev-on-danger: #0b1511;
    --ev-border-strong: #667c73;
    --ev-focus: #7fb0d1;
    --ev-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ev-bg); color: var(--ev-text); font-family: var(--ev-font); font-size: 16px; line-height: 1.55; }
  :focus-visible { outline: 3px solid var(--ev-focus); outline-offset: 2px; }

  /* ===== Mouvement : transitions courtes (150 ms) sur les boutons seulement, aucune animation d'entrée ===== */
  button { transition: background-color .15s ease; }
  a[href], button, [role="button"], select, summary { cursor: pointer; }
  /* Classes conservées pour ne pas casser le JSX existant, mais sans animation (MASTER) */
  .pace-fade-in, .pace-scale-in { animation: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }

  /* ===== Responsive : élargissement intelligent tablette / bureau ===== */
  .pace-frame {
    width: 390px;
    max-width: 100vw;
  }
  @media (min-width: 700px) {
    .pace-frame { width: 480px; }
    .pace-app-outer { padding: 24px 0; }
  }
  @media (min-width: 1024px) {
    .pace-frame { width: 600px; }
  }

  /* ===== Listes de cartes (admin) : grille responsive — exploite la largeur disponible sur
     tablette/bureau au lieu de rester en colonne unique quelle que soit la taille d'écran. */
  .pace-grid-cards {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    align-items: start;
  }
  @media (min-width: 700px) {
    .pace-grid-cards { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 1100px) {
    .pace-grid-cards { grid-template-columns: repeat(3, 1fr); }
  }

  /* ===== Écran admin : exploite davantage l'espace sur grand écran ===== */
  @media (min-width: 700px) {
    .pace-frame-wide { width: 92vw; }
  }
  @media (min-width: 1024px) {
    .pace-frame-wide { width: 90vw; max-width: 1100px; }
  }
  @media (min-width: 1440px) {
    .pace-frame-wide { max-width: 1280px; }
  }

  /* ===== Champs de formulaire (MASTER) : 16 px, 44 px de haut, bordure >= 3:1 ===== */
  input, textarea, select {
    background: var(--ev-surface);
    color: var(--ev-text);
    caret-color: var(--ev-primary);
    border: 1px solid var(--ev-border-strong);
    border-radius: var(--ev-radius);
    font-family: inherit;
  }
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):not([type="color"]),
  textarea, select { font-size: 16px !important; min-height: var(--ev-tap); }
  input:focus, textarea:focus, select:focus { outline: 3px solid var(--ev-focus); outline-offset: 0; border-color: var(--ev-focus); }
  input::placeholder, textarea::placeholder { color: var(--ev-text-muted); opacity: 1; }
  select option { background: var(--ev-surface); color: var(--ev-text); }
  input[type="checkbox"], input[type="radio"] { width: 20px; height: 20px; margin: 0; flex: none; }
  input:-webkit-autofill, textarea:-webkit-autofill {
    -webkit-text-fill-color: var(--ev-text);
    box-shadow: 0 0 0px 1000px var(--ev-surface) inset;
    transition: background-color 9999s ease-in-out 0s;
  }

  /* ===== Optimisation mobile (visuel et tactile uniquement, aucun changement de structure) ===== */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }  /* pas d'agrandissement auto du texte en paysage (iOS) */
  body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-wrap: break-word; }  /* mots longs : coupés au lieu de déborder */
  button, a, input, select, textarea, [role="button"] { touch-action: manipulation; }  /* supprime le délai de double-tap */
  button, [role="button"] { -webkit-tap-highlight-color: transparent; }  /* pas de retour visuel décoratif (MASTER) */
  input[type="checkbox"], input[type="radio"], input[type="range"] { accent-color: var(--c-accent); }
  button:disabled { cursor: not-allowed; }

  /* ===== Barres fixes : l'en-tête reste en haut et la navigation reste en bas, en permanence ===== */
  /* z-index 1100 : au-dessus de la carte (Leaflet monte à 1000), sous les fenêtres et plein écrans (>= 1200) */
  .pace-header {
    position: sticky !important; top: 0; z-index: 1100;
    padding-top: calc(18px + env(safe-area-inset-top, 0px)) !important;  /* encoche / barre d'état en appli installée (0 sinon) */
  }
  .pace-bottom-nav {
    position: fixed !important; bottom: 0 !important; left: 50% !important; right: auto !important;
    transform: translateX(-50%); z-index: 1100;
    width: var(--pace-frame-w); max-width: 100vw;  /* même largeur que .pace-frame */
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)) !important;  /* barre d'accueil iPhone (0 sinon) */
  }
  body { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  /* ===== Menu hamburger : panneau latéral limité à la largeur de l'application (mobile et desktop) ===== */
  .pace-drawer-root {
    position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
    width: var(--pace-frame-w); max-width: 100vw; overflow: hidden;
  }

  /* ===== Largeur de l'application et orientation de l'affichage (Auto / Portrait / Paysage) ===== */
  .pace-app-outer { --pace-frame-w: 390px; }
  @media (min-width: 700px)  { .pace-app-outer { --pace-frame-w: 480px; } }
  @media (min-width: 1024px) { .pace-app-outer { --pace-frame-w: 600px; } }
  @media (min-width: 700px) {
    .orient-portrait { --pace-frame-w: 480px; }          /* colonne étroite façon téléphone, même sur grand écran */
    .orient-paysage  { --pace-frame-w: min(92vw, 960px); } /* exploite la largeur disponible */
    .orient-portrait .pace-frame:not(.pace-frame-wide),
    .orient-paysage  .pace-frame:not(.pace-frame-wide) { width: var(--pace-frame-w); }
  }
  /* Suivi automatique de l'orientation du téléphone : dès que l'appareil passe en paysage (écran peu haut),
     l'application exploite toute la largeur utilisable (hors encoche, 960px max) ; en revenant en portrait,
     elle reprend sa largeur habituelle. Aucun réglage nécessaire. Le choix manuel « Portrait » reste respecté. */
  @media (orientation: landscape) and (max-height: 500px) {
    .pace-app-outer:not(.orient-portrait) {
      --pace-frame-w: min(calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)), 960px);
    }
    .pace-app-outer:not(.orient-portrait) .pace-frame:not(.pace-frame-wide) { width: var(--pace-frame-w); }
  }
  /* Écran peu haut (téléphone en paysage) : barres fixes plus compactes pour laisser de la place au contenu */
  @media (max-height: 500px) {
    .pace-header { padding-top: calc(8px + env(safe-area-inset-top, 0px)) !important; padding-bottom: 10px !important; }
    .pace-bottom-nav { padding-top: 4px !important; padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px)) !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.14/dist/esri-leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<script type="module" src="/src/main.jsx"></script>


<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
