<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>EcoVigil</title>
<meta name="theme-color" content="#007A3D" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="./icon-16.png" sizes="16x16" type="image/png" />
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="EcoVigil" />
<script>
  // Distingue le nom de l'onglet et le nom suggéré par "Ajouter à l'écran d'accueil" (iOS lit le
  // <title>/la balise apple-mobile-web-app-title au moment de l'enregistrement) selon qu'on ouvre
  // le lien citoyen ou le lien admin (?admin=1) — permet d'avoir deux raccourcis distincts sur
  // l'écran d'accueil, un par espace, plutôt que deux icônes identiques nommées "EcoVigil".
  (function () {
    try {
      var estAdmin = new URLSearchParams(location.search).get("admin") === "1";
      if (!estAdmin) return;
      document.title = "Centre EcoVigil";
      var meta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (meta) meta.setAttribute("content", "Centre EcoVigil");
      var theme = document.querySelector('meta[name="theme-color"]');
      if (theme) theme.setAttribute("content", "#8B2E2E"); // teinte différente pour repérer l'onglet/l'appli admin au premier coup d'œil
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  /* ===== Thème : variables sémantiques (clair par défaut) ===== */
  :root {
    --c-bg: #EEF3EC;
    --c-surface: #fff;
    --c-surface-soft: #F1F4EE;
    --c-surface-dashed: #F8FAF8;
    --c-border: #E1E9E3;
    --c-border-soft: #D8E4DA;
    --c-text: #17211C;
    --c-text-secondary: #5B6B60;
    --c-text-muted: #6B7280;
    --c-text-faint: #B7C6BC;
    --c-warning-bg: #FBEFE3;
    --c-success-bg: #E3F0E8;
    --c-danger-border-soft: #F3D9D0;
    --c-warning-border-soft: #F0D5B8;
    --c-progress-track: #8FBFA0;
    --c-danger: #B5451B;
    --c-warning: #D4A017;
    --c-warning-text: #8A6318;
    --shadow-sm: 0 2px 8px rgba(23,33,28,0.06);
    --shadow-md: 0 6px 20px rgba(23,33,28,0.12);
    color-scheme: light;
  }

  /* Accents de marque (vert par défaut, bleu, doré) — mêmes valeurs en clair/sombre pour rester vifs */
  :root, .accent-green { --c-accent-dark: #007A3D; --c-accent: #4CAF50; --c-sky: #0077B6; }
  .accent-blue         { --c-accent-dark: #123A4A; --c-accent: #2E6E86; --c-sky: #5FB0C9; }
  .accent-gold         { --c-accent-dark: #4A3610; --c-accent: #8A6318; --c-sky: #C9962E; }

  /* ===== Mode sombre ===== */
  .pace-dark {
    --c-bg: #12181A;
    --c-surface: #1C2420;
    --c-surface-soft: #22302A;
    --c-surface-dashed: #1A211D;
    --c-border: #2E3B34;
    --c-border-soft: #263029;
    --c-text: #EAF1EC;
    --c-text-secondary: #A9B8AE;
    --c-text-muted: #8A9790;
    --c-text-faint: #5B6B60;
    --c-warning-bg: #332A1C;
    --c-success-bg: #1C3327;
    --c-danger-border-soft: #3A241C;
    --c-warning-border-soft: #362C1C;
    --c-progress-track: #3E5A4A;
    --c-danger: #DE7249;
    --c-warning: #D4A017;
    --c-warning-text: #D4A017;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.35);
    --shadow-md: 0 6px 24px rgba(0,0,0,0.45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--c-bg); font-family: 'Work Sans', sans-serif; transition: background-color .25s ease; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid var(--c-accent); outline-offset: 2px;
  }

  /* ===== Retour tactile / animations fluides (Material-like) ===== */
  button { transition: transform .12s ease, opacity .12s ease, background-color .2s ease, box-shadow .2s ease; }
  button:not(:disabled):active { transform: scale(0.96); }
  img { transition: opacity .2s ease; }

  @keyframes paceFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes paceScaleIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
  .pace-fade-in { animation: paceFadeIn .28s ease both; }
  .pace-scale-in { animation: paceScaleIn .3s cubic-bezier(.2,.8,.2,1) both; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  /* ===== Responsive : élargissement intelligent tablette / bureau ===== */
  .pace-frame {
    width: 390px;
    max-width: 100vw;
    transition: width .25s ease;
  }
  @media (min-width: 700px) {
    .pace-frame { width: 480px; }
    .pace-app-outer { padding: 24px 0; }
  }
  @media (min-width: 1024px) {
    .pace-frame { width: 600px; }
    body { font-size: 1.03em; }
  }

  /* ===== Listes de cartes (admin) : grille responsive — exploite la largeur disponible sur
     tablette/bureau au lieu de rester en colonne unique quelle que soit la taille d'écran. */
  .pace-grid-cards {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    align-items: start;
  }
  @media (min-width: 700px) {
    .pace-grid-cards { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 1100px) {
    .pace-grid-cards { grid-template-columns: repeat(3, 1fr); }
  }

  /* ===== Écran admin : exploite davantage l'espace sur grand écran ===== */
  @media (min-width: 700px) {
    .pace-frame-wide { width: 92vw; }
  }
  @media (min-width: 1024px) {
    .pace-frame-wide { width: 90vw; max-width: 1100px; }
  }
  @media (min-width: 1440px) {
    .pace-frame-wide { max-width: 1280px; }
  }

  /* ===== Champs de formulaire : couleurs forcées (indépendant du rendu par défaut du navigateur) ===== */
  input, textarea, select {
    background: var(--c-surface);
    color: var(--c-text);
    caret-color: var(--c-accent);
  }
  input::placeholder, textarea::placeholder { color: var(--c-text-muted); opacity: 1; }
  select option { background: var(--c-surface); color: var(--c-text); }
  input:-webkit-autofill, textarea:-webkit-autofill {
    -webkit-text-fill-color: var(--c-text);
    box-shadow: 0 0 0px 1000px var(--c-surface) inset;
    transition: background-color 9999s ease-in-out 0s;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.14/dist/esri-leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet/leaflet-maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<script type="module" src="/src/main.jsx"></script>


<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
